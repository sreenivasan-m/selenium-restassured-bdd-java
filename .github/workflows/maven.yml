# This workflow builds and runs the Selenium RestAssured BDD Java project

name: Selenium RestAssured BDD

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  # Allows the workflow to be run manually from GitHub Actions
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Run Cucumber/TestNG tests using testng.xml
      - name: Run Cucumber Tests
        run: mvn clean test -DsuiteXmlFile=testng.xml

      # Upload Surefire reports even if tests fail
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-test-reports
          path: |
            target/surefire-reports/
            target/*.html
            target/*.json